name: 🗺️ Adventure Log

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_NAME: Paimon Bot
          COMMIT_MSG: "✦ Adventure log updated"
          MAX_LINES: 6
          EMPTY_COMMIT_MSG: "✦ Adventure log: nothing new today"
