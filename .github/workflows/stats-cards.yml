name: 📊 Adventure Stats Cards

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/cards.py", ".github/workflows/stats-cards.yml"]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/cards.py "${{ github.repository_owner }}" cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "Paimon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards
          git diff --cached --quiet || (git commit -m "✦ Stats cards updated" && git pull --rebase && git push)
