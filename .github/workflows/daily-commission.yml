name: 🗡️ Daily Commission

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC = Genshin server reset (Europe)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/teyvat.py README.md
      - name: Commit if changed
        run: |
          git config user.name "Paimon Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "✦ Daily commission refreshed" && git push)
