name: 🐍 Abyss Serpent

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Genshin palette: gold serpent over Anemo-green contribution dots
          outputs: |
            dist/genshin-snake.svg?color_snake=#d3bc8e&color_dots=#1f2333,#1f3d3a,#2e6b5e,#4fa38a,#74c2a8&color_background=#1b1d2a
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
