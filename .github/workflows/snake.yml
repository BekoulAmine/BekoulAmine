name: 🐍 Snake Game

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # neon-green snake eating GitHub-green contribution dots
          outputs: |
            dist/snake.svg?color_snake=#79ff97&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353&color_background=#0d1117
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
